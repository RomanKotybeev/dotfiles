<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
    <alias>
        <family>monospace</family>
        <prefer>
            <family>IosevkaTermSlab Nerd Font</family>
        </prefer>
    </alias>
    <match target="font">
        <edit name="pixelsize">
            <if>
                <less>
                    <name>pixelsize</name>
                    <double>12.5</double>
                </less>
                <int>14</int>
                <round>
                    <name>pixelsize</name>
                </round>
            </if>
        </edit>
    </match>
</fontconfig>
