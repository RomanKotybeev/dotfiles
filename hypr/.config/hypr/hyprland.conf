#monitor=HDMI-A-1, 2560x1440@75Hz,0x0,auto
#monitor=eDP-1, disable
#monitor = eDP-1, 2240x1400, 0x0, auto

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar
exec-once = dunst
exec-once = hyprpaper

# Screen Sharing 
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once =~ /.config/hypr/scripts/screensharing.sh
exec-once = [workspace special silent] alacritty --class scratchpad

input {
  kb_layout = us,ru
  kb_options = grp:caps_toggle 
  repeat_rate = 40
  repeat_delay = 240
  sensitivity = 0.15

  touchpad {
    natural_scroll = no
    tap_button_map = lmr
  }
}

general {
  layout = dwindle
  gaps_in = 3
  gaps_out = 3
  border_size = 0
  col.active_border = 0xff5e81ac
  col.inactive_border = 0x66333333
}

decoration {
  rounding = 5
  shadow {
    range = 10
    color = 0xffa7caff
    color_inactive = 0x50000000
  }
}

animations {
    enabled = 1

    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    bezier = ease, 0.4, 0.02, 0.21, 0.99

    # animation = NAME, ONOFF, SPEED, CURVE [,STYLE]
    animation = windows, 1, 4, overshot, slide
    animation = fade, 1, 10, default
    animation = workspaces, 1, 3.5, ease
    animation = border, 1, 14, default
    animation = specialWorkspace, 0
}

dwindle {
  pseudotile = true
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
  vfr = true
}

windowrule = float, class:^(chromium)$, title:^(Save File)$
windowrule = float, class:^(chromium)$, title:^(Open File)$
windowrule = float, class:^(firefox)$, title:^(Picture-in-Picture)$

# Float scratchpad
windowrule = float, class:^(scratchpad)$
windowrule = size 700 400, class:^(scratchpad)$
windowrule = center, class:^(scratchpad)$
windowrule = opacity 0.8 override 0.7 override, class:^(scratchpad)$
windowrule = animation popin, class:^(scratchpad)$

# Smart gaps. No gaps when only 1 window
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
windowrule = rounding 0, floating:0, onworkspace:w[tv1]
windowrule = bordersize 0, floating:0, onworkspace:f[1]
windowrule = rounding 0, floating:0, onworkspace:f[1]
windowrule = workspace special, class:^(scratchpad)$

bind = SUPER, grave, togglespecialworkspace,
bind = SUPER, Q, killactive
bind = SUPER, W, exec, MOZ_ENABLE_WAYLAND=1 firefox
bind = SUPER, F, fullscreen, 1
bind = SUPERSHIFT, F, fullscreen, 0
bind = SUPER, E, exec,browse_selector.sh
bind = SUPER, G, togglegroup
bind = SUPER, Tab, changegroupactive
bind = SUPER, RETURN, exec, alacritty --class my_term
bind = SUPER, B, exec, killall waybar || waybar
bind = SUPER, D, exec, rofi -show drun
bind = SUPER, ESCAPE, exec,systemctl suspend
bind = SUPER, Z, exec, zathura
bind = SUPER, T, togglefloating,
bind = SUPER, N, exec, swaylock -c 000000
bind = SHIFTSUPER, ESCAPE, exec,systemctl poweroff -i
bind = SUPERSHIFT, Q, exit,
bind = SUPERSHIFT, grave, exec, alacritty --class scratchpad
bind = SUPERSHIFT, S, movetoworkspace, special
bind = SUPERSHIFT, RETURN, layoutmsg, swapwithmaster
bind = ,Print, exec, grim -g "$(slurp)" - | swappy -f -
bind=,XF86AudioMute,exec,~/.config/hypr/scripts/volume mute
bind=,XF86AudioLowerVolume,exec,~/.config/hypr/scripts/volume down
bind=,XF86AudioRaiseVolume,exec,~/.config/hypr/scripts/volume up
bind=,XF86AudioMicMute,exec,pactl set-source-mute @DEFAULT_SOURCE@ toggle


bind = SUPER, j, movefocus, d
bind = SUPER, k, movefocus, u
bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, left, resizeactive, -40 0
bind = SUPER, right, resizeactive, 40 0
bind = SUPER, up, resizeactive, 0 -40
bind = SUPER, down, resizeactive, 0 40
bind = SUPERSHIFT, h, movewindow, l
bind = SUPERSHIFT, l, movewindow, r
bind = SUPERSHIFT, k, movewindow, u
bind = SUPERSHIFT, j, movewindow, d
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPERSHIFT, 1, movetoworkspacesilent, 1
bind = SUPERSHIFT, 2, movetoworkspacesilent, 2
bind = SUPERSHIFT, 3, movetoworkspacesilent, 3
bind = SUPERSHIFT, 4, movetoworkspacesilent, 4
bind = SUPERSHIFT, 5, movetoworkspacesilent, 5
bind = SUPERSHIFT, 6, movetoworkspacesilent, 6
bind = SUPERSHIFT, 7, movetoworkspacesilent, 7
bind = SUPERSHIFT, 8, movetoworkspacesilent, 8
bind = SUPERSHIFT, 9, movetoworkspacesilent, 9
bind = SUPERSHIFT, 0, movetoworkspacesilent, 10
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bindle=,XF86MonBrightnessUp,exec,~/.config/hypr/scripts/brightness up  # increase screen brightness
bindle=,XF86MonBrightnessDown,exec,~/.config/hypr/scripts/brightness down # decrease screen brightnes

xwayland {
  force_zero_scaling = true
}
env = GDK_SCALE,2
env = XCURSOR_SIZE,32
